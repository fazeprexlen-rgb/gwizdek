name: Codzienna aktualizacja bloga

on:
  schedule:
    - cron: "15 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pobierz dzisiejsze tematy i zbuduj stronę
        run: python sport-blog/generate.py.

      - name: Zapisz dane dnia w repozytorium
        run: |
          git config user.name "gwizdek-bot"
          git config user.email "gwizdek-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Dane z $(date -u +%F)"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
